name: PR Review and Comment Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

jobs:
  pr_review_agent_job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR Review Agent on PRs and Comments

    steps:
      # Step 1: Ensure the sender is not a bot
      - name: Check Sender
        if: ${{ github.event.sender.type == 'Bot' }}
        run: |
          echo "Action triggered by a bot. Exiting."
          exit 0

      # Step 2: Pre-check for pull_request events
      - name: Pre-check for pull_request Event
        if: ${{ github.event_name == 'pull_request' }}
        id: pre_check_pull_request
        run: |
          echo "Checking conditions for pull_request event."
          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "Pull request is a draft. Exiting."
            exit 0
          fi

          echo "Fetching labels..."
          LABELS_JSON='${{ toJson(github.event.pull_request.labels) }}'

          # Parse the label names
          LABELS=$(echo "$LABELS_JSON" | jq -r '.[].name')

          echo "Labels: $LABELS"

          # Check if the 'Dont Review' label exists
          if echo "$LABELS" | grep -q "Dont Review"; then
            echo "Label 'Dont Review' found. Exiting."
            exit 0
          fi

          TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$TITLE" | grep -q "\[Review\]"; then
            echo "Pull request title does not contain '[Review]'. Exiting."
            exit 0
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Pre-check for issue_comment events
      - name: Pre-check for issue_comment Event
        if: ${{ github.event_name == 'issue_comment' }}
        id: pre_check_issue_comment
        run: |
          echo "Checking conditions for issue_comment event."
          PR_NUMBER=$(jq -r .issue.number <<< "${{ toJson(github.event) }}")
          echo "Fetching labels for PR #$PR_NUMBER"
          LABELS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/labels" | jq -r '.[].name')
          echo "Labels: $LABELS"

          if echo "$LABELS" | grep -q "Dont Review"; then
            echo "Label 'Dont Review' found. Exiting."
            exit 0
          fi

          COMMENT_BODY="${{ github.event.comment.body }}"
          if ! echo "$COMMENT_BODY" | grep -E "/review|/describe|/improve|/ask" > /dev/null; then
            echo "No relevant comment command found. Exiting."
            exit 0
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Run PR Agent
      - name: Run PR Agent action step
        uses: arvindanta/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI.API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI.KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI.API_VERSION: ${{ secrets.OPENAI_API_VERSION }}
          OPENAI.DEPLOYMENT_ID: ${{ secrets.OPENAI_DEPLOYMENT_ID }}
          OPENAI.API_TYPE: "azure"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: "opened,reopened,ready_for_review,review_requested"
          github_action_config.comment_actions: "created,edited"
          pr_description.publish_labels: "false"
          pr_description.publish_description_as_comment: "true"
          pr_description.publish_description_as_comment_persistent: "true"
          pr_description.enable_help_text: "false"
          pr_reviewer.num_code_suggestions: "6"
          pr_reviewer.enable_help_text: "false"
          pr_reviewer.inline_code_comments: "true"
          pr_reviewer.enable_review_labels_effort: "false"
          pr_code_suggestions.num_code_suggestions_per_chunk: "6"
          pr_code_suggestions.commitable_code_suggestions: "true"
          pr_code_suggestions.enable_help_text: "false"
